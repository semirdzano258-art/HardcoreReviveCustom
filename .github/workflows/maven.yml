name: Build HardcoreRevive

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file HardcoreRevive-source/HardcoreRevive/pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreRevive
          path: HardcoreRevive-source/HardcoreRevive/target/HardcoreRevive-1.0.0.jar

